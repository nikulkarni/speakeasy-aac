<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SpeakEasy — hands-free communication</title>
<style>
  /* ---- Design tokens: calm, high-contrast, large targets ---- */
  :root{
    --bg:#101418;          /* deep slate, easy on the eyes */
    --surface:#1a2028;
    --surface-2:#222b35;
    --line:#33404d;
    --ink:#f2f6fa;
    --muted:#9fb0bf;
    --focus:#ffd166;       /* warm amber: the key you're about to pick */
    --dwell:#28c2a0;       /* teal: progress toward selecting */
    --accent:#6aa8ff;
    --danger:#ff6b6b;
    --radius:16px;
  }
  /* High-contrast alternative for low-vision users */
  body.hc{
    --bg:#000; --surface:#000; --surface-2:#000; --line:#fff;
    --ink:#fff; --muted:#fff; --focus:#ffec3d; --dwell:#00e5a0; --accent:#7fb2ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden;}
  body{display:flex;flex-direction:column;}

  /* ---- Top bar ---- */
  .bar{display:flex;align-items:center;gap:12px;padding:12px 18px;
    background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .bar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;}
  .status{font-size:13px;color:var(--muted);}
  .status b{color:var(--dwell);}
  .spacer{flex:1;}
  button.ctrl{font:inherit;font-size:14px;font-weight:600;border-radius:10px;
    border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
    padding:10px 16px;cursor:pointer;}
  button.ctrl:hover{border-color:var(--accent);}
  button.ctrl.primary{background:var(--accent);color:#06121f;border-color:var(--accent);}

  /* ---- Message display ---- */
  .screen{padding:18px;background:var(--surface);border-bottom:1px solid var(--line);}
  .msg{min-height:64px;font-size:30px;line-height:1.3;font-weight:600;
    background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 20px;word-break:break-word;}
  .msg .caret{color:var(--accent);animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}
  .msg:empty::before{content:"Your message will appear here";color:var(--muted);font-weight:400;}

  /* ---- Keyboard ---- */
  .board{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;justify-content:center;}
  .row{display:flex;gap:10px;justify-content:center;}
  .key{position:relative;flex:1;max-width:120px;min-width:0;height:clamp(56px,11vh,96px);
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);border:2px solid var(--line);border-radius:var(--radius);
    font-size:clamp(20px,3.2vh,30px);font-weight:700;user-select:none;overflow:hidden;}
  .key.wide{max-width:none;flex:2;font-size:clamp(15px,2.4vh,20px);letter-spacing:.5px;}
  .key .fill{position:absolute;left:0;bottom:0;width:100%;height:0%;
    background:var(--dwell);opacity:.85;z-index:0;transition:height .05s linear;}
  .key .glyph{position:relative;z-index:1;}
  .key.focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(255,209,102,.35);}
  .key.speak{color:var(--dwell);}
  .key.danger{color:var(--danger);}

  /* ---- Head cursor ---- */
  #cursor{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
    background:rgba(106,168,255,.25);border:2px solid var(--accent);z-index:60;pointer-events:none;
    box-shadow:0 0 12px rgba(106,168,255,.5);display:none;}
  #cursor svg{position:absolute;inset:-6px;transform:rotate(-90deg);}
  #cursor circle{fill:none;stroke:var(--dwell);stroke-width:4;stroke-linecap:round;}

  /* ---- Camera preview ---- */
  #cam{position:fixed;right:14px;bottom:14px;width:150px;border-radius:12px;
    border:1px solid var(--line);transform:scaleX(-1);z-index:40;background:#000;opacity:.9;}
  #cam.hidden{display:none;}

  /* ---- Panels (start + settings) ---- */
  .panel{position:fixed;inset:0;background:rgba(8,11,15,.92);display:flex;
    align-items:center;justify-content:center;padding:24px;z-index:80;}
  .panel .card{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);
    border-radius:20px;padding:28px 30px;}
  .card h2{margin:0 0 8px;font-size:22px;}
  .card p{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 18px;}
  .setting{display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:12px 0;border-top:1px solid var(--line);}
  .setting:first-of-type{border-top:none;}
  .setting label{font-size:15px;font-weight:600;}
  .setting .val{color:var(--dwell);font-variant-numeric:tabular-nums;min-width:56px;text-align:right;}
  input[type=range]{width:200px;accent-color:var(--accent);}
  input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);}
  .row-btns{display:flex;gap:12px;margin-top:22px;}
  .hidden{display:none!important;}
  .err{color:var(--danger);font-size:14px;margin-top:12px;}
</style>
</head>
<body>

<!-- Start screen -->
<div class="panel" id="startPanel">
  <div class="card">
    <h2>SpeakEasy</h2>
    <p>Type and speak using only your camera. Move your head to point at a key, then <b>hold still on it</b>
       (or blink) to select. Everything runs on your device — no video is ever uploaded or saved.</p>
    <div class="row-btns">
      <button class="ctrl primary" id="startBtn">Turn on camera & start</button>
    </div>
    <div class="err hidden" id="startErr"></div>
  </div>
</div>

<!-- Settings -->
<div class="panel hidden" id="settingsPanel">
  <div class="card">
    <h2>Settings</h2>
    <div class="setting">
      <label>Hold time to select</label>
      <input type="range" id="dwellRange" min="500" max="2500" step="100" value="1000">
      <span class="val" id="dwellVal">1.0s</span>
    </div>
    <div class="setting">
      <label>Head sensitivity</label>
      <input type="range" id="sensRange" min="1.5" max="6" step="0.5" value="3.5">
      <span class="val" id="sensVal">3.5×</span>
    </div>
    <div class="setting">
      <label>Blink to select</label>
      <input type="checkbox" id="blinkChk" checked>
    </div>
    <div class="setting">
      <label>High contrast</label>
      <input type="checkbox" id="hcChk">
    </div>
    <div class="row-btns">
      <button class="ctrl" id="recalibBtn">Recenter head position</button>
      <button class="ctrl primary" id="closeSettings">Done</button>
    </div>
  </div>
</div>

<div class="bar">
  <h1>SpeakEasy</h1>
  <span class="status" id="status">Ready</span>
  <div class="spacer"></div>
  <button class="ctrl" id="calibBtn">Recenter</button>
  <button class="ctrl" id="settingsBtn">Settings</button>
</div>

<div class="screen">
  <div class="msg" id="msg"></div>
</div>

<div class="board" id="board"></div>

<div id="cursor">
  <svg viewBox="0 0 26 26"><circle id="ring" cx="13" cy="13" r="15" pathLength="100"
    stroke-dasharray="100" stroke-dashoffset="100"></circle></svg>
</div>

<video id="cam" playsinline muted class="hidden"></video>

<script type="module">
import { FaceLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10/vision_bundle.mjs";

/* ============ Config / state ============ */
const cfg = { dwellMs:1000, sens:3.5, blink:true };
const state = {
  centerX:0.5, centerY:0.5,   // calibrated neutral head position
  smoothX:0.5, smoothY:0.5,    // smoothed cursor (0..1)
  focusKey:null, dwellElapsed:0,
  blinkLatch:false, blinkHeld:0,
  lastCommit:0, lastTs:0,
  landmarker:null, running:false
};

/* ============ Build keyboard ============ */
const LAYOUT = [
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L"],
  ["Z","X","C","V","B","N","M"],
];
const board = document.getElementById("board");
function makeKey(glyph, action, cls=""){
  const k = document.createElement("div");
  k.className = "key " + cls;
  k.dataset.action = action;
  k.innerHTML = `<div class="fill"></div><span class="glyph">${glyph}</span>`;
  return k;
}
LAYOUT.forEach(letters=>{
  const row = document.createElement("div"); row.className="row";
  letters.forEach(L=> row.appendChild(makeKey(L, "char:"+L)));
  board.appendChild(row);
});
const actionRow = document.createElement("div"); actionRow.className="row";
actionRow.appendChild(makeKey("SPACE","space","wide"));
actionRow.appendChild(makeKey("&#9003;","backspace","wide"));
actionRow.appendChild(makeKey("&#128264; SPEAK","speak","wide speak"));
actionRow.appendChild(makeKey("CLEAR","clear","wide danger"));
board.appendChild(actionRow);
const keys = [...document.querySelectorAll(".key")];

/* ============ Message handling ============ */
let text = "";
const msgEl = document.getElementById("msg");
function render(){ msgEl.innerHTML = escapeHtml(text) + '<span class="caret">|</span>'; }
function escapeHtml(s){ return s.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
render();

function commit(action){
  const now = performance.now();
  if (now - state.lastCommit < 500) return;    // shared cooldown
  state.lastCommit = now;
  if (action.startsWith("char:")) text += action.slice(5);
  else if (action === "space") text += " ";
  else if (action === "backspace") text = text.slice(0,-1);
  else if (action === "clear") text = "";
  else if (action === "speak") speak(text);
  render();
  // brief cooldown so the same key doesn't instantly re-fire
  state.dwellElapsed = -400;
}

function speak(t){
  if (!t.trim() || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.rate = 1; u.pitch = 1;
  speechSynthesis.speak(u);
}

/* ============ Camera + model ============ */
const video = document.getElementById("cam");
const statusEl = document.getElementById("status");

async function start(){
  const startErr = document.getElementById("startErr");
  try{
    statusEl.textContent = "Starting camera…";
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user" } });
    video.srcObject = stream;
    video.classList.remove("hidden");
    await video.play();

    statusEl.textContent = "Loading face model…";
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10/wasm");
    state.landmarker = await FaceLandmarker.createFromOptions(fileset, {
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO",
      numFaces:1,
      outputFaceBlendshapes:true
    });

    document.getElementById("startPanel").classList.add("hidden");
    document.getElementById("cursor").style.display="block";
    state.running = true;
    statusEl.innerHTML = "<b>Tracking</b> · move your head to point";
    requestAnimationFrame(loop);
  }catch(e){
    startErr.classList.remove("hidden");
    startErr.textContent = "Couldn't start: " + e.message +
      " — allow camera access, and run this from a web address or localhost (not a file).";
    statusEl.textContent = "Camera error";
  }
}

/* ============ Main loop ============ */
const cursorEl = document.getElementById("cursor");
const ringEl = document.getElementById("ring");

function loop(){
  if(!state.running) return;
  const ts = performance.now();
  const dt = state.lastTs ? ts - state.lastTs : 16;
  state.lastTs = ts;

  const res = state.landmarker.detectForVideo(video, ts);
  if (res.faceLandmarks && res.faceLandmarks.length){
    const lm = res.faceLandmarks[0];
    updatePointer(lm[1]);                       // landmark 1 = nose tip
    if (cfg.blink && res.faceBlendshapes?.length){
      handleBlink(res.faceBlendshapes[0].categories, dt);
    }
    updateDwell(dt);
  } else {
    statusEl.textContent = "No face detected — center yourself in view";
  }
  requestAnimationFrame(loop);
}

function updatePointer(nose){
  // mirror X so head-right => cursor-right; amplify around calibrated center
  const px = 1 - nose.x, py = nose.y;
  let cx = 0.5 + (px - state.centerX) * cfg.sens;
  let cy = 0.5 + (py - state.centerY) * (cfg.sens * 1.25); // vertical needs a bit more gain
  cx = Math.min(1, Math.max(0, cx));
  cy = Math.min(1, Math.max(0, cy));
  const a = 0.35;                                // smoothing
  state.smoothX += (cx - state.smoothX) * a;
  state.smoothY += (cy - state.smoothY) * a;
  const x = state.smoothX * window.innerWidth;
  const y = state.smoothY * window.innerHeight;
  cursorEl.style.left = x + "px";
  cursorEl.style.top  = y + "px";
}

function keyUnderCursor(){
  const x = state.smoothX * window.innerWidth;
  const y = state.smoothY * window.innerHeight;
  for (const k of keys){
    const r = k.getBoundingClientRect();
    if (x>=r.left && x<=r.right && y>=r.top && y<=r.bottom) return k;
  }
  return null;
}

function updateDwell(dt){
  const k = keyUnderCursor();
  if (k !== state.focusKey){
    if (state.focusKey){ state.focusKey.classList.remove("focus"); setFill(state.focusKey,0); }
    state.focusKey = k;
    state.dwellElapsed = 0;
    if (k) k.classList.add("focus");
  }
  if (!k){ ringEl.style.strokeDashoffset = 100; return; }

  state.dwellElapsed += dt;
  const prog = Math.max(0, Math.min(1, state.dwellElapsed / cfg.dwellMs));
  ringEl.style.strokeDashoffset = 100 - prog*100;   // ring fills around cursor
  setFill(k, prog*100);                             // key fills up too
  if (state.dwellElapsed >= cfg.dwellMs){
    commit(k.dataset.action);
    setFill(k,0); ringEl.style.strokeDashoffset = 100;
  }
}
function setFill(k, pct){ k.querySelector(".fill").style.height = pct + "%"; }

function handleBlink(cats, dt){
  const get = n => (cats.find(c=>c.categoryName===n)?.score) || 0;
  const blink = (get("eyeBlinkLeft") + get("eyeBlinkRight"))/2;
  if (blink > 0.5){
    if (!state.blinkLatch){
      state.blinkHeld += dt;
      if (state.blinkHeld > 150 && state.focusKey){  // deliberate hold, not a natural blink
        commit(state.focusKey.dataset.action);
        state.blinkLatch = true;
      }
    }
  } else if (blink < 0.3){
    state.blinkLatch = false; state.blinkHeld = 0;
  }
}

/* ============ Calibration & settings ============ */
function recenter(){
  // capture current head position as the new neutral center
  state.landmarkerReady = true;
  const res = state.landmarker?.detectForVideo(video, performance.now());
  if (res?.faceLandmarks?.length){
    const nose = res.faceLandmarks[0][1];
    state.centerX = 1 - nose.x;
    state.centerY = nose.y;
    statusEl.innerHTML = "<b>Recentered</b> · look straight ahead";
  }
}

document.getElementById("startBtn").onclick = start;
document.getElementById("calibBtn").onclick = recenter;
document.getElementById("recalibBtn").onclick = recenter;
document.getElementById("settingsBtn").onclick = ()=>document.getElementById("settingsPanel").classList.remove("hidden");
document.getElementById("closeSettings").onclick = ()=>document.getElementById("settingsPanel").classList.add("hidden");

const dwellRange=document.getElementById("dwellRange"), dwellVal=document.getElementById("dwellVal");
dwellRange.oninput = ()=>{ cfg.dwellMs=+dwellRange.value; dwellVal.textContent=(cfg.dwellMs/1000).toFixed(1)+"s"; };
const sensRange=document.getElementById("sensRange"), sensVal=document.getElementById("sensVal");
sensRange.oninput = ()=>{ cfg.sens=+sensRange.value; sensVal.textContent=cfg.sens.toFixed(1)+"×"; };
document.getElementById("blinkChk").onchange = e=> cfg.blink=e.target.checked;
document.getElementById("hcChk").onchange = e=> document.body.classList.toggle("hc", e.target.checked);
</script>
</body>
</html>
